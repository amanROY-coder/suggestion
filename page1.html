<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campus Voice - Login & Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-950 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 p-8">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600/20 text-indigo-400 rounded-2xl mb-3 border border-indigo-500/20">
        <i class="fa-solid fa-graduation-cap text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-white tracking-tight">Campus Voice</h1>
      <p class="text-slate-400 text-sm mt-1">College Anonymous Portal</p>
    </div>

    <!-- Toggle Buttons -->
    <div class="grid grid-cols-2 bg-slate-950 p-1 rounded-xl mb-6 border border-slate-800">
      <button type="button" id="tab-login" onclick="switchTab('login')" class="py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white transition-all shadow-sm">
        Sign In
      </button>
      <button type="button" id="tab-register" onclick="switchTab('register')" class="py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all">
        Register
      </button>
    </div>

    <!-- Alert Box -->
    <div id="status-msg" class="hidden mb-4 p-3 rounded-xl text-xs font-medium border text-center"></div>

    <!-- SIGN IN FORM -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase">College Email</label>
        <input type="text" id="login-email" required placeholder="rollno@college.edu or ID" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase">Password</label>
        <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition text-sm flex items-center justify-center gap-2">
        <span>Enter Portal</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </button>
    </form>

    <!-- REGISTER FORM -->
    <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase">College Email</label>
        <input type="email" id="reg-email" required placeholder="rollno@college.edu" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase">Select Branch / Department</label>
        <select id="reg-branch" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="" disabled selected>Choose your branch...</option>
          <option value="Computer Science & Engg (CSE)">Computer Science & Engg (CSE)</option>
          <option value="Information Tech & IoT">Information Tech & IoT</option>
          <option value="Electronics & Comm (ECE)">Electronics & Comm (ECE)</option>
          <option value="Mechanical Engg (ME)">Mechanical Engg (ME)</option>
          <option value="Civil Engg (CE)">Civil Engg (CE)</option>
          <option value="Electrical Engg (EE)">Electrical Engg (EE)</option>
          <option value="Management & Others">Management & Others</option>
          <option value="fashion designing">fashion designing</option>
          <option value="BBA">BBA</option>
          <option value="MEDICAL">MEDICAL</option>
          <option value="BCA">BCA</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase">Secret Anonymous Handle</label>
        <input type="text" id="reg-alias" required placeholder="e.g. Lotus, Shinchan, Doraemon" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1.5 uppercase">Password</label>
        <input type="password" id="reg-password" required minlength="4" placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>

      <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition text-sm">
        Submit Registration
      </button>
    </form>
  </div>

  <script>
    // Initialize Fixed Admin sirji@ggi in Database
    (function initAdmin() {
      let users = JSON.parse(localStorage.getItem('users') || "[]");
      if (!users.some(u => u.email === "sirji@ggi")) {
        users.push({
          email: "sirji@ggi",
          alias: "Super Admin",
          branch: "Director Office",
          password: "admin", // Default password for sirji@ggi
          role: "superadmin"
        });
        localStorage.setItem('users', JSON.stringify(users));
      }
    })();

    function displayMsg(msg, isSuccess = false) {
      const box = document.getElementById('status-msg');
      box.className = isSuccess 
        ? "mb-4 p-3 rounded-xl text-xs font-medium border text-center bg-emerald-500/10 text-emerald-400 border-emerald-500/30" 
        : "mb-4 p-3 rounded-xl text-xs font-medium border text-center bg-rose-500/10 text-rose-400 border-rose-500/30";
      box.innerText = msg;
      box.classList.remove('hidden');
    }

    function switchTab(type) {
      const loginForm = document.getElementById('login-form');
      const regForm = document.getElementById('register-form');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      document.getElementById('status-msg').classList.add('hidden');

      if (type === 'login') {
        loginForm.classList.remove('hidden');
        regForm.classList.add('hidden');
        tabLogin.className = "py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white transition-all shadow-sm";
        tabRegister.className = "py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all";
      } else {
        regForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
        tabRegister.className = "py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white transition-all shadow-sm";
        tabLogin.className = "py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white transition-all";
      }
    }

    function handleRegister(e) {
      e.preventDefault();
      const email = document.getElementById('reg-email').value.trim().toLowerCase();
      const branch = document.getElementById('reg-branch').value;
      const alias = document.getElementById('reg-alias').value.trim();
      const password = document.getElementById('reg-password').value;

      if (email === 'sirji@ggi') {
        displayMsg("Yeh email restricted hai!", false);
        return;
      }

      let storedUsers = JSON.parse(localStorage.getItem('users') || "[]");

      if (storedUsers.some(u => u.email === email)) {
        displayMsg("Yeh email pehle se registered hai. Sign In karein.", false);
        return;
      }

      const newUser = { email, branch, alias, password, role: "student" };
      storedUsers.push(newUser);
      localStorage.setItem('users', JSON.stringify(storedUsers));

      displayMsg("Registration complete! Sign In karein.", true);
      document.getElementById('register-form').reset();

      setTimeout(() => {
        switchTab('login');
      }, 1000);
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim().toLowerCase();
      const password = document.getElementById('login-password').value;

      let storedUsers = JSON.parse(localStorage.getItem('users') || "[]");
      const matchedUser = storedUsers.find(u => u.email === email && u.password === password);

      if (!matchedUser) {
        displayMsg("Galat ID ya Password!", false);
        return;
      }

      localStorage.setItem('currentUser', JSON.stringify(matchedUser));
      displayMsg("Login successful!", true);

      setTimeout(() => {
        // sirji@ggi -> Admin Portal, Others -> Student Dashboard
        if (matchedUser.email === "sirji@ggi" || matchedUser.role === 'superadmin') {
          window.location.href = "admin.html";
        } else {
          window.location.href = "page2.html";
        }
      }, 500);
    }
  </script>
</body>
</html>
