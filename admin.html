<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal - Campus Voice</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">

  <!-- TOP BAR -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/30 flex items-center justify-center text-amber-400 font-bold">
          <i class="fa-solid fa-user-shield text-lg"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-white">Super Admin Console</h1>
          <p class="text-xs text-slate-400">Logged in as: <span class="text-amber-400 font-semibold">sirji@ggi</span></p>
        </div>
      </div>
      <button onclick="logout()" class="px-3 py-1.5 text-xs text-rose-400 bg-rose-950/40 border border-rose-800/40 rounded-lg hover:bg-rose-900/50 transition flex items-center gap-1.5">
        <i class="fa-solid fa-arrow-right-from-bracket"></i> Logout
      </button>
    </div>

    <!-- ADMIN TABS -->
    <div class="max-w-6xl mx-auto px-4 flex border-t border-slate-800/80 gap-6">
      <button onclick="switchAdminTab('home')" id="tab-admin-home" class="py-3 text-sm font-semibold border-b-2 border-indigo-500 text-indigo-400 flex items-center gap-2">
        <i class="fa-solid fa-house"></i> Home (All Suggestions)
      </button>
      <button onclick="switchAdminTab('marks')" id="tab-admin-marks" class="py-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-white flex items-center gap-2">
        <i class="fa-solid fa-bookmark"></i> Marks (<span id="marked-count-badge">0</span>)
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6">

    <!-- 4 METRIC STATS -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <div class="flex items-center justify-between text-slate-400 mb-1">
          <span class="text-xs uppercase font-semibold">Total Suggestions</span>
          <i class="fa-solid fa-inbox text-indigo-400"></i>
        </div>
        <h3 id="stat-total" class="text-3xl font-bold text-white">0</h3>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <div class="flex items-center justify-between text-yellow-500 mb-1">
          <span class="text-xs uppercase font-semibold">Pending Review</span>
          <i class="fa-solid fa-clock"></i>
        </div>
        <h3 id="stat-pending" class="text-3xl font-bold text-yellow-400">0</h3>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <div class="flex items-center justify-between text-blue-400 mb-1">
          <span class="text-xs uppercase font-semibold">In Progress</span>
          <i class="fa-solid fa-spinner"></i>
        </div>
        <h3 id="stat-progress" class="text-3xl font-bold text-blue-400">0</h3>
      </div>

      <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl">
        <div class="flex items-center justify-between text-emerald-400 mb-1">
          <span class="text-xs uppercase font-semibold">Resolved</span>
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <h3 id="stat-resolved" class="text-3xl font-bold text-emerald-400">0</h3>
      </div>
    </div>

    <!-- FILTER BAR -->
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl mb-6 flex flex-wrap gap-4 items-center justify-between">
      <div class="flex flex-wrap gap-3 items-center">
        <span class="text-xs text-slate-400 uppercase font-semibold"><i class="fa-solid fa-filter mr-1"></i> Filter:</span>
        <select id="filter-branch" onchange="renderAdminFeed()" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="ALL">All Branches</option>
          <option value="Computer Science & Engg (CSE)">Computer Science & Engg (CSE)</option>
          <option value="Information Tech & IoT">Information Tech & IoT</option>
          <option value="Electronics & Comm (ECE)">Electronics & Comm (ECE)</option>
          <option value="Mechanical Engg (ME)">Mechanical Engg (ME)</option>
          <option value="Civil Engg (CE)">Civil Engg (CE)</option>
          <option value="Electrical Engg (EE)">Electrical Engg (EE)</option>
          <option value="Management & Others">Management & Others</option>
        </select>

        <select id="filter-status" onchange="renderAdminFeed()" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <option value="ALL">All Statuses</option>
          <option value="Pending Review">Pending Review</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
        </select>
      </div>

      <p id="view-indicator" class="text-xs text-indigo-400 font-medium">Viewing: All Suggestions</p>
    </div>

    <!-- SUGGESTIONS LIST -->
    <div id="admin-feed-container" class="space-y-4">
      <!-- Cards rendered via JS -->
    </div>

  </main>

  <script>
    // Verify sirji@ggi Session
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser || currentUser.email !== 'sirji@ggi') {
      window.location.href = "page1.html";
    }

    let activeTab = 'home'; // 'home' | 'marks'

    function switchAdminTab(tab) {
      activeTab = tab;
      const tabHome = document.getElementById('tab-admin-home');
      const tabMarks = document.getElementById('tab-admin-marks');
      const indicator = document.getElementById('view-indicator');

      if (tab === 'home') {
        tabHome.className = "py-3 text-sm font-semibold border-b-2 border-indigo-500 text-indigo-400 flex items-center gap-2";
        tabMarks.className = "py-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-white flex items-center gap-2";
        indicator.innerText = "Viewing: All Suggestions";
      } else {
        tabMarks.className = "py-3 text-sm font-semibold border-b-2 border-indigo-500 text-indigo-400 flex items-center gap-2";
        tabHome.className = "py-3 text-sm font-semibold border-b-2 border-transparent text-slate-400 hover:text-white flex items-center gap-2";
        indicator.innerText = "Viewing: Marked for Later Suggestions";
      }

      renderAdminFeed();
    }

    function renderAdminFeed() {
      const posts = JSON.parse(localStorage.getItem('suggestions') || "[]");
      const branchFilter = document.getElementById('filter-branch').value;
      const statusFilter = document.getElementById('filter-status').value;

      // Update 4 Top Metrics
      document.getElementById('stat-total').innerText = posts.length;
      document.getElementById('stat-pending').innerText = posts.filter(p => !p.status || p.status === 'Pending Review' || p.status === 'Under Review').length;
      document.getElementById('stat-progress').innerText = posts.filter(p => p.status === 'In Progress').length;
      document.getElementById('stat-resolved').innerText = posts.filter(p => p.status === 'Resolved').length;

      // Update Marks Badge Count
      const markedCount = posts.filter(p => p.isMarked).length;
      document.getElementById('marked-count-badge').innerText = markedCount;

      // Apply Tab Filter & Dropdown Filters
      let filtered = posts.filter(post => {
        const matchesTab = (activeTab === 'home') || (activeTab === 'marks' && post.isMarked);
        const matchesBranch = branchFilter === 'ALL' || post.branch === branchFilter;
        
        let currentStatus = post.status || 'Pending Review';
        if (currentStatus === 'Under Review') currentStatus = 'Pending Review';

        const matchesStatus = statusFilter === 'ALL' || currentStatus === statusFilter;

        return matchesTab && matchesBranch && matchesStatus;
      });

      const container = document.getElementById('admin-feed-container');

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-12 text-center text-slate-500">
            <i class="fa-solid fa-folder-open text-4xl mb-3"></i>
            <p>${activeTab === 'marks' ? 'Koi bhi suggestion mark nahi kiya gaya hai.' : 'Koi suggestion nahi mila.'}</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map((post) => {
        const repostCount = (post.repostedBy || []).length;
        const upvoteCount = (post.upvotedBy || []).length;
        const currentStatus = post.status || 'Pending Review';
        const isMarked = post.isMarked || false;

        return `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-slate-700 transition">
            <div class="flex items-center justify-between mb-3">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs font-bold text-indigo-400">
                  <i class="fa-solid fa-user-secret mr-1"></i> ${escapeHtml(post.author)}
                </span>
                <span class="text-[10px] bg-slate-950 text-slate-400 px-2 py-0.5 rounded-md border border-slate-800 font-medium">
                  ${escapeHtml(post.branch || 'General')}
                </span>
                <span class="text-[11px] bg-indigo-950/60 text-indigo-300 border border-indigo-800/40 px-2.5 py-0.5 rounded-full font-medium">
                  ${escapeHtml(post.category)}
                </span>
              </div>

              <!-- Top Action: Bookmark / Mark for Later -->
              <button onclick="toggleMark('${post.id}')" class="px-3 py-1 text-xs rounded-lg border transition flex items-center gap-1.5 ${
                isMarked 
                  ? 'bg-amber-500/20 text-amber-400 border-amber-500/40 font-semibold' 
                  : 'bg-slate-950 text-slate-400 border-slate-800 hover:text-white'
              }">
                <i class="fa-solid fa-bookmark ${isMarked ? 'text-amber-400' : ''}"></i>
                <span>${isMarked ? 'Marked' : 'Mark for Later'}</span>
              </button>
            </div>

            <h3 class="text-base font-semibold text-white mb-1">${escapeHtml(post.title)}</h3>
            <p class="text-sm text-slate-300 mb-4 whitespace-pre-wrap">${escapeHtml(post.desc)}</p>

            <div class="flex flex-wrap items-center justify-between gap-4 border-t border-slate-800/80 pt-3 text-xs text-slate-400">
              <div class="flex items-center gap-3">
                <span><i class="fa-regular fa-calendar mr-1"></i> ${post.date || 'Recent'}</span>
                <span class="text-indigo-400 font-semibold">▲ Upvotes: ${upvoteCount}</span>
                <span class="text-emerald-400 font-semibold">🔁 Reposts: ${repostCount}</span>
              </div>

              <!-- Admin Controls: Status Selector & Direct Delete -->
              <div class="flex items-center gap-2">
                <span class="text-[11px] text-slate-400 uppercase font-semibold">Status:</span>
                <select onchange="updateStatus('${post.id}', this.value)" class="bg-slate-950 border border-slate-700 text-xs rounded-lg px-2.5 py-1.5 text-white focus:outline-none focus:ring-1 focus:ring-indigo-500">
                  <option value="Pending Review" ${currentStatus === 'Pending Review' || currentStatus === 'Under Review' ? 'selected' : ''}>Pending Review</option>
                  <option value="In Progress" ${currentStatus === 'In Progress' ? 'selected' : ''}>In Progress</option>
                  <option value="Resolved" ${currentStatus === 'Resolved' ? 'selected' : ''}>Resolved</option>
                </select>

                <button onclick="adminDelete('${post.id}')" title="Delete suggestion permanently" class="px-3 py-1.5 bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/40 text-rose-400 rounded-lg font-medium transition flex items-center gap-1">
                  <i class="fa-solid fa-trash-can"></i>
                  <span>Delete</span>
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Toggle Mark for Later
    function toggleMark(postId) {
      let posts = JSON.parse(localStorage.getItem('suggestions') || "[]");
      const post = posts.find(p => p.id === postId);
      if (post) {
        post.isMarked = !post.isMarked;
        localStorage.setItem('suggestions', JSON.stringify(posts));
        renderAdminFeed();
      }
    }

    // Update Status
    function updateStatus(postId, newStatus) {
      let posts = JSON.parse(localStorage.getItem('suggestions') || "[]");
      const post = posts.find(p => p.id === postId);
      if (post) {
        post.status = newStatus;
        localStorage.setItem('suggestions', JSON.stringify(posts));
        renderAdminFeed();
      }
    }

    // Admin Delete Any Suggestion
    function adminDelete(postId) {
      if (confirm("Admin Confirm: Kya aap sach me is suggestion ko delete karna chahte hain?")) {
        let posts = JSON.parse(localStorage.getItem('suggestions') || "[]");
        posts = posts.filter(p => p.id !== postId);
        localStorage.setItem('suggestions', JSON.stringify(posts));
        renderAdminFeed();
      }
    }

    function logout() {
      localStorage.removeItem('currentUser');
      window.location.href = "page1.html";
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    renderAdminFeed();
  </script>
</body>
</html>
