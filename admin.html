<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal - GGI Suggestion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-16 font-sans">

  <!-- TOP HEADER -->
  <header class="sticky top-4 z-40 max-w-6xl mx-auto px-4">
    <div class="bg-white/95 backdrop-blur-md border border-slate-200 rounded-2xl shadow-lg shadow-slate-200/50 px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3.5">
        <div class="w-10 h-10 rounded-xl bg-amber-50 border border-amber-200 flex items-center justify-center text-amber-600 font-bold text-lg shadow-sm">
          <i class="fa-solid fa-user-shield"></i>
        </div>
        <div>
          <h1 class="text-base font-bold text-slate-900 leading-tight">Super Admin Desk</h1>
          <p class="text-xs text-slate-500">Console: <span class="text-teal-700 font-semibold">sirji@ggi</span></p>
        </div>
      </div>

      <!-- Navigation Tabs & Actions -->
      <div class="flex items-center gap-3">
        <button onclick="switchAdminTab('home')" id="tab-admin-home" class="px-4 py-2 text-xs font-semibold rounded-xl bg-teal-600 text-white transition shadow-sm flex items-center gap-1.5">
          <i class="fa-solid fa-inbox"></i> All Suggestions
        </button>
        <button onclick="switchAdminTab('marks')" id="tab-admin-marks" class="px-4 py-2 text-xs font-semibold rounded-xl bg-slate-100 text-slate-600 hover:text-slate-900 transition flex items-center gap-1.5">
          <i class="fa-solid fa-bookmark"></i> Bookmarks (<span id="marked-count-badge">0</span>)
        </button>
        <button onclick="logout()" class="p-2 text-xs text-rose-600 bg-rose-50 border border-rose-100 rounded-xl hover:bg-rose-100 transition" title="Logout">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">

    <!-- 4 METRIC STAT CARDS -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
      <div class="bg-white border border-slate-200/90 p-5 rounded-2xl shadow-sm">
        <div class="flex items-center justify-between text-slate-500 mb-2">
          <span class="text-xs uppercase font-bold tracking-wider">Total Received</span>
          <div class="w-8 h-8 rounded-lg bg-teal-50 text-teal-600 flex items-center justify-center">
            <i class="fa-solid fa-inbox text-sm"></i>
          </div>
        </div>
        <h3 id="stat-total" class="text-2xl sm:text-3xl font-extrabold text-slate-900">0</h3>
      </div>

      <div class="bg-white border border-slate-200/90 p-5 rounded-2xl shadow-sm">
        <div class="flex items-center justify-between text-slate-500 mb-2">
          <span class="text-xs uppercase font-bold tracking-wider">Rated (Top Board)</span>
          <div class="w-8 h-8 rounded-lg bg-amber-50 text-amber-600 flex items-center justify-center">
            <i class="fa-solid fa-star text-sm"></i>
          </div>
        </div>
        <h3 id="stat-rated" class="text-2xl sm:text-3xl font-extrabold text-amber-600">0</h3>
      </div>

      <div class="bg-white border border-slate-200/90 p-5 rounded-2xl shadow-sm">
        <div class="flex items-center justify-between text-slate-500 mb-2">
          <span class="text-xs uppercase font-bold tracking-wider">In Progress</span>
          <div class="w-8 h-8 rounded-lg bg-sky-50 text-sky-600 flex items-center justify-center">
            <i class="fa-solid fa-spinner text-sm"></i>
          </div>
        </div>
        <h3 id="stat-progress" class="text-2xl sm:text-3xl font-extrabold text-sky-600">0</h3>
      </div>

      <div class="bg-white border border-slate-200/90 p-5 rounded-2xl shadow-sm">
        <div class="flex items-center justify-between text-slate-500 mb-2">
          <span class="text-xs uppercase font-bold tracking-wider">Resolved</span>
          <div class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center">
            <i class="fa-solid fa-circle-check text-sm"></i>
          </div>
        </div>
        <h3 id="stat-resolved" class="text-2xl sm:text-3xl font-extrabold text-emerald-600">0</h3>
      </div>
    </div>

    <!-- FILTER & SEARCH BAR -->
    <div class="bg-white border border-slate-200/90 p-4 rounded-2xl mb-6 flex flex-wrap gap-4 items-center justify-between shadow-sm">
      <div class="flex flex-wrap gap-3 items-center flex-1">
        
        <!-- Search Input -->
        <div class="relative min-w-[200px] flex-1 max-w-xs">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
          <input 
            type="text" 
            id="search-query" 
            oninput="renderAdminFeed()" 
            placeholder="Search title, desc..." 
            class="w-full bg-slate-50 border border-slate-200 rounded-xl pl-9 pr-3 py-2 text-xs text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-600 transition" 
          />
        </div>

        <!-- 10 Categories Filter -->
        <select id="filter-category" onchange="renderAdminFeed()" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-700 font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-600 transition">
          <option value="ALL">All Categories</option>
          <option value="Infrastructure">Infrastructure</option>
          <option value="Admission">Admission</option>
          <option value="IT Department">IT Department</option>
          <option value="Accounts">Accounts</option>
          <option value="Transport">Transport</option>
          <option value="Sports">Sports</option>
          <option value="Hostel & Residence">Hostel & Residence</option>
          <option value="Cafeteria">Cafeteria</option>
          <option value="Academic">Academic</option>
          <option value="Security">Security</option>
        </select>

        <!-- Status Filter -->
        <select id="filter-status" onchange="renderAdminFeed()" class="bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-700 font-medium focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-600 transition">
          <option value="ALL">All Statuses</option>
          <option value="Pending Review">Pending Review</option>
          <option value="In Progress">In Progress</option>
          <option value="Resolved">Resolved</option>
        </select>
      </div>

      <p id="view-indicator" class="text-xs text-teal-700 font-semibold bg-teal-50 px-3 py-1.5 rounded-lg border border-teal-100">
        All Suggestions
      </p>
    </div>

    <!-- SUGGESTIONS LIST FEED -->
    <div id="admin-feed-container" class="space-y-4">
      <!-- Injected via JavaScript -->
    </div>

  </main>

  <!-- IMAGE VIEW MODAL -->
  <div id="image-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="relative max-w-3xl w-full bg-white rounded-2xl overflow-hidden shadow-2xl p-2">
      <button onclick="closeImageModal()" class="absolute top-4 right-4 bg-slate-900/70 hover:bg-slate-900 text-white w-8 h-8 rounded-full flex items-center justify-center transition">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
      <img id="modal-img-src" src="" alt="Proof Preview" class="max-h-[80vh] w-full object-contain rounded-xl" />
    </div>
  </div>

  <script>
    // Verify Admin Session
    const currentUser = JSON.parse(localStorage.getItem('currentUser'));
    if (!currentUser || (currentUser.email !== 'sirji@ggi' && currentUser.role !== 'superadmin')) {
      window.location.href = "index.html";
    }

    let activeTab = 'home'; // 'home' | 'marks'

    function switchAdminTab(tab) {
      activeTab = tab;
      const tabHome = document.getElementById('tab-admin-home');
      const tabMarks = document.getElementById('tab-admin-marks');
      const indicator = document.getElementById('view-indicator');

      if (tab === 'home') {
        tabHome.className = "px-4 py-2 text-xs font-semibold rounded-xl bg-teal-600 text-white transition shadow-sm flex items-center gap-1.5";
        tabMarks.className = "px-4 py-2 text-xs font-semibold rounded-xl bg-slate-100 text-slate-600 hover:text-slate-900 transition flex items-center gap-1.5";
        indicator.innerText = "All Suggestions";
      } else {
        tabMarks.className = "px-4 py-2 text-xs font-semibold rounded-xl bg-teal-600 text-white transition shadow-sm flex items-center gap-1.5";
        tabHome.className = "px-4 py-2 text-xs font-semibold rounded-xl bg-slate-100 text-slate-600 hover:text-slate-900 transition flex items-center gap-1.5";
        indicator.innerText = "Bookmarked Suggestions";
      }

      renderAdminFeed();
    }

    function renderAdminFeed() {
      const posts = JSON.parse(localStorage.getItem('suggestions') || "[]");
      const categoryFilter = document.getElementById('filter-category').value;
      const statusFilter = document.getElementById('filter-status').value;
      const searchQuery = document.getElementById('search-query').value.trim().toLowerCase();

      // Update 4 Metrics
      document.getElementById('stat-total').innerText = posts.length;
      document.getElementById('stat-rated').innerText = posts.filter(p => p.stars && p.stars > 0).length;
      document.getElementById('stat-progress').innerText = posts.filter(p => p.status === 'In Progress').length;
      document.getElementById('stat-resolved').innerText = posts.filter(p => p.status === 'Resolved').length;

      // Update Bookmarks Count
      const markedCount = posts.filter(p => p.isMarked).length;
      document.getElementById('marked-count-badge').innerText = markedCount;

      // Filter Logic
      let filtered = posts.filter(post => {
        const matchesTab = (activeTab === 'home') || (activeTab === 'marks' && post.isMarked);
        const matchesCategory = categoryFilter === 'ALL' || post.category === categoryFilter;
        
        let currentStatus = post.status || 'Pending Review';
        if (currentStatus === 'Under Review') currentStatus = 'Pending Review';
        const matchesStatus = statusFilter === 'ALL' || currentStatus === statusFilter;

        const matchesSearch = !searchQuery || 
          (post.title && post.title.toLowerCase().includes(searchQuery)) ||
          (post.desc && post.desc.toLowerCase().includes(searchQuery)) ||
          (post.author && post.author.toLowerCase().includes(searchQuery));

        return matchesTab && matchesCategory && matchesStatus && matchesSearch;
      });

      const container = document.getElementById('admin-feed-container');

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-3xl p-12 text-center text-slate-400 shadow-sm">
            <div class="w-14 h-14 bg-slate-50 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-slate-200">
              <i class="fa-solid fa-folder-open text-2xl"></i>
            </div>
            <p class="font-bold text-slate-700 text-base">Koi suggestion nahi mila</p>
            <p class="text-xs text-slate-400 mt-1">${activeTab === 'marks' ? 'Aapne abhi tak koi suggestion bookmark nahi kiya hai.' : 'Filters reset karke dekhein.'}</p>
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map((post) => {
        const currentStatus = post.status || 'Pending Review';
        const isMarked = post.isMarked || false;
        const starCount = post.stars || 0;

        return `
          <div class="bg-white border border-slate-200/90 rounded-2xl p-6 shadow-sm hover:shadow-md transition">
            
            <!-- Top Header info -->
            <div class="flex items-center justify-between mb-3.5 flex-wrap gap-2">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-xs font-bold text-teal-700">
                  <i class="fa-solid fa-user-secret mr-1"></i> ${escapeHtml(post.author)}
                </span>
                <span class="text-[11px] bg-slate-100 text-slate-700 px-2.5 py-0.5 rounded-md border border-slate-200 font-semibold">
                  ${escapeHtml(post.category)}
                </span>
                <span class="text-xs text-slate-400 font-medium">
                  <i class="fa-regular fa-calendar ml-1 mr-1"></i> ${post.date || 'Recent'}
                </span>
              </div>

              <!-- Bookmark Action -->
              <button onclick="toggleMark('${post.id}')" class="px-3 py-1.5 text-xs rounded-xl border transition flex items-center gap-1.5 ${
                isMarked 
                  ? 'bg-amber-50 text-amber-700 border-amber-200 font-bold' 
                  : 'bg-slate-50 text-slate-500 border-slate-200 hover:text-slate-800'
              }">
                <i class="fa-solid fa-bookmark ${isMarked ? 'text-amber-500' : ''}"></i>
                <span>${isMarked ? 'Marked' : 'Mark for Later'}</span>
              </button>
            </div>

            <!-- Suggestion Content -->
            <h3 class="text-base font-bold text-slate-900 mb-1.5">${escapeHtml(post.title)}</h3>
            <p class="text-sm text-slate-600 mb-4 whitespace-pre-wrap leading-relaxed">${escapeHtml(post.desc)}</p>

            <!-- Uploaded Image Preview (If exists) -->
            ${post.image ? `
              <div class="mb-4 inline-flex items-center gap-3 p-2 bg-slate-50 border border-slate-200 rounded-xl">
                <img src="${post.image}" alt="Proof" class="w-14 h-14 rounded-lg object-cover border border-slate-200 cursor-pointer" onclick="openImageModal('${post.image}')" />
                <div>
                  <p class="text-xs font-bold text-slate-800">Attached Proof Image</p>
                  <button type="button" onclick="openImageModal('${post.image}')" class="text-[11px] text-teal-600 hover:underline font-semibold flex items-center gap-1 mt-0.5">
                    <i class="fa-solid fa-expand"></i> Click to enlarge
                  </button>
                </div>
              </div>
            ` : ''}

            <!-- Bottom Controls: STAR RATING + STATUS + DELETE -->
            <div class="flex flex-wrap items-center justify-between gap-4 border-t border-slate-100 pt-4">
              
              <!-- 1 to 5 STAR RATING SYSTEM -->
              <div class="flex items-center gap-2">
                <span class="text-xs font-bold text-slate-700 uppercase tracking-wider">Rating:</span>
                <div class="flex items-center gap-1 bg-slate-50 border border-slate-200 px-2.5 py-1 rounded-xl">
                  ${[1, 2, 3, 4, 5].map(starNum => `
                    <button 
                      type="button" 
                      onclick="setStarRating('${post.id}', ${starNum === starCount ? 0 : starNum})" 
                      title="${starNum} Star rating"
                      class="transition hover:scale-125 focus:outline-none">
                      <i class="fa-solid fa-star text-sm ${starNum <= starCount ? 'text-amber-400' : 'text-slate-300 hover:text-amber-200'}"></i>
                    </button>
                  `).join('')}
                  <span class="text-xs font-bold text-slate-600 ml-1.5">${starCount > 0 ? starCount + '★' : 'Unrated'}</span>
                </div>
              </div>

              <!-- Status Dropdown & Delete -->
              <div class="flex items-center gap-2">
                <span class="text-xs font-semibold text-slate-500 uppercase">Status:</span>
                <select onchange="updateStatus('${post.id}', this.value)" class="bg-slate-50 border border-slate-200 text-xs font-medium rounded-xl px-3 py-1.5 text-slate-800 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-600 transition">
                  <option value="Pending Review" ${currentStatus === 'Pending Review' || currentStatus === 'Under Review' ? 'selected' : ''}>Pending Review</option>
                  <option value="In Progress" ${currentStatus === 'In Progress' ? 'selected' : ''}>In Progress</option>
                  <option value="Resolved" ${currentStatus === 'Resolved' ? 'selected' : ''}>Resolved</option>
                </select>

                <button onclick="adminDelete('${post.id}')" title="Delete permanently" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-600 rounded-xl text-xs font-semibold transition flex items-center gap-1.5">
                  <i class="fa-solid fa-trash-can"></i>
                  <span>Delete</span>
                </button>
              </div>

            </div>

          </div>
        `;
      }).join('');
    }

    // Set 1 to 5 Star Rating
    function setStarRating(postId, stars) {
      let posts = JSON.parse(localStorage.getItem('suggestions') || "[]");
      const post = posts.find(p => p.id === postId);
      if (post) {
        post.stars = stars;
        localStorage.setItem('suggestions', JSON.stringify(posts));
        renderAdminFeed();
      }
    }

    // Toggle Bookmark
    function toggleMark(postId) {
      let posts = JSON.parse(localStorage.getItem('suggestions') || "[]");
      const post = posts.find(p => p.id === postId);
      if (post) {
        post.isMarked = !post.isMarked;
        localStorage.setItem('suggestions', JSON.stringify(posts));
        renderAdminFeed();
      }
    }

    // Update Status
    function updateStatus(postId, newStatus) {
      let posts = JSON.parse(localStorage.getItem('suggestions') || "[]");
      const post = posts.find(p => p.id === postId);
      if (post) {
        post.status = newStatus;
        localStorage.setItem('suggestions', JSON.stringify(posts));
        renderAdminFeed();
      }
    }

    // Admin Delete
    function adminDelete(postId) {
      if (confirm("Admin Confirm: Kya aap sach me is suggestion ko delete karna chahte hain?")) {
        let posts = JSON.parse(localStorage.getItem('suggestions') || "[]");
        posts = posts.filter(p => p.id !== postId);
        localStorage.setItem('suggestions', JSON.stringify(posts));
        renderAdminFeed();
      }
    }

    // Image Modal Controls
    function openImageModal(imgSrc) {
      document.getElementById('modal-img-src').src = imgSrc;
      document.getElementById('image-modal').classList.remove('hidden');
    }

    function closeImageModal() {
      document.getElementById('image-modal').classList.add('hidden');
      document.getElementById('modal-img-src').src = "";
    }

    function logout() {
      localStorage.removeItem('currentUser');
      window.location.href = "index.html";
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    renderAdminFeed();
  </script>
</body>
</html>
